name: SysZero · Validate & Deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syszero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application
        run: npm run check
      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: syszero-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Cloudflare Workers Static Assets
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    environment:
      name: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: syszero-dist
          path: dist/
      - name: Require Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets before deploying."
            exit 1
          fi
      - name: Deploy static assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
